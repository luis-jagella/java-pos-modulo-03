name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-ai-service:
    name: Test AI service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: quarkus-ai-aula04/pom.xml

      - name: Test with Maven
        run: mvn --batch-mode --no-transfer-progress -f quarkus-ai-aula04/pom.xml test
