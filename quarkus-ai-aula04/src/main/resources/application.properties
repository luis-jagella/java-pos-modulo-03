# Configuração do modelo local servido pelo Ollama.
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_MODEL:llama3.2}
quarkus.langchain4j.ollama.chat-model.temperature=0.3
quarkus.langchain4j.ollama.embedding-model.model-id=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
quarkus.langchain4j.ollama.timeout=60s

# Evita subir um container automaticamente: a aula usa a instalação local do Ollama.
quarkus.langchain4j.ollama.devservices.enabled=false

# Easy RAG: os arquivos do classpath são ingeridos na inicialização e enriquecem o AI Service.
quarkus.langchain4j.easy-rag.path=rag
quarkus.langchain4j.easy-rag.path-type=CLASSPATH
